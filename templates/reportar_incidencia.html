<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de incidencias municipal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        main {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px 40px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        textarea,
        button {
            font-size: 14px;
            font-family: inherit;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid teal;
        }

        button {
            padding: 8px 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            border: 1px solid white;
            padding: 8px;
            text-align: left;
        }

        th {
            background: white;
        }
    </style>
</head>
<body>
    <main>
        <h1>Reporte de incidencias municipal</h1>
        <p>Ingrese el DNI del ciudadano para cargar sus datos automáticamente</p>
        <p>Una vez completado, ingerese los detalles de incidencia.</p>
        <section>
            <h2>Datos del ciudadano</h2>
            <form id="ciudadano-form" autocomplete="off">
                <div>
                    <label for="dni">DNI</label>
                    <input id="dni" name="dni" type="text" inputmode="numeric" maxlength="8" required />
                </div>
                <div>
                    <button id="buscar-ciudadano" type="button">Buscar ciudadano</button>
                </div>
                <div>
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" disabled />
                </div>
                <div>
                    <label for="correo">Correo</label>
                    <input id="correo" name="correo" type="email" disabled />
                </div>
                <div>
                    <label for="telefono">Telefono</label>
                    <input id="telefono" name="telefono" type="text" disabled />
                </div>
                <p id="ciudadano-mensaje" role="status"></p>
            </form>
        </section>

        <section id="incidencia-section" hidden>
            <h2>Reporte de incidencia</h2>
            <form id="incidencia-form" autocomplete="off">
                <div>
                    <label for="titulo">Titulo</label>
                    <input id="titulo" name="titulo" type="text" required />
                </div>
                <div>
                    <label for="descripcion">Descripcion</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
                </div>
                <div>
                    <label for="evidencia">Evidencia (opcional)</label>
                    <input id="evidencia" name="evidencia" type="file" accept="image/*" />
                </div>
                <div>
                    <button type="submit">Publicar incidencia</button>
                </div>
            </form>
        </section>

        <section id="listado-incidencias">
            <h2>Listado de incidencias</h2>
            <table>
                <thead>
                    <tr>
                        <th>Fecha de reporte</th>
                        <th>Titulo</th>
                        <th>Estado</th>
                        <th>Evidencia</th>
                    </tr>
                </thead>
                <tbody id="incidencias-body">
                    <tr>
                        <td colspan="4">Cargando incidencias...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const dniInput = document.getElementById('dni');
        const nombreInput = document.getElementById('nombre');
        const correoInput = document.getElementById('correo');
        const telefonoInput = document.getElementById('telefono');
        const mensaje = document.getElementById('ciudadano-mensaje');
        const buscarButton = document.getElementById('buscar-ciudadano');
        const incidenciaSection = document.getElementById('incidencia-section');
        const incidenciaForm = document.getElementById('incidencia-form');
        const evidenciaInput = document.getElementById('evidencia');
        const incidenciasBody = document.getElementById('incidencias-body');

        const MAX_EVIDENCIA_BYTES = 5 * 1024 * 1024;

        const setFields = (data) => {
            nombreInput.value = data?.nombre || '';
            correoInput.value = data?.email || '';
            telefonoInput.value = data?.telefono || '';
        };

        const clearFields = () => {
            nombreInput.value = '';
            correoInput.value = '';
            telefonoInput.value = '';
        };

        const setIncidenciaVisible = (isVisible) => {
            incidenciaSection.hidden = !isVisible;
        };

        const buscarCiudadano = async (dni) => {
            mensaje.textContent = '';
            clearFields();
            setIncidenciaVisible(false);

            if (!dni) {
                return;
            }

            try {
                const response = await fetch(`/api/ciudadanos/${encodeURIComponent(dni)}/`);
                if (!response.ok) {
                    if (response.status === 404) {
                        mensaje.textContent = 'Ciudadano no existe';
                        return;
                    }
                    mensaje.textContent = 'Error al consultar ciudadano';
                    return;
                }

                const data = await response.json();
                setFields(data);
                setIncidenciaVisible(true);
            } catch (error) {
                mensaje.textContent = 'Error de red al consultar ciudadano';
            }
        };

        dniInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                buscarCiudadano(dniInput.value.trim());
            }
        });

        buscarButton.addEventListener('click', () => {
            buscarCiudadano(dniInput.value.trim());
        });

        const validarEvidencia = (file) => {
            if (!file) {
                return { ok: true };
            }

            if (!file.type.startsWith('image/')) {
                return { ok: false, message: 'La evidencia debe ser una imagen.' };
            }

            if (file.size > MAX_EVIDENCIA_BYTES) {
                return { ok: false, message: 'La evidencia no debe superar 5 MB.' };
            }

            return { ok: true };
        };

        const formatearFecha = (isoString) => {
            if (!isoString) {
                return '';
            }
            const fecha = new Date(isoString);
            if (Number.isNaN(fecha.getTime())) {
                return isoString;
            }
            return fecha.toLocaleString();
        };

        const renderIncidencias = (incidencias) => {
            incidenciasBody.innerHTML = '';

            if (!incidencias.length) {
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="4">No hay incidencias registradas.</td>';
                incidenciasBody.appendChild(row);
                return;
            }

            incidencias.forEach((incidencia) => {
                const row = document.createElement('tr');
                const evidenciaLink = incidencia.evidencia
                    ? `<a href="${incidencia.evidencia}" target="_blank" rel="noopener">Descargar</a>`
                    : 'Sin evidencia';

                row.innerHTML = `
                    <td>${formatearFecha(incidencia.fecha_creacion)}</td>
                    <td>${incidencia.titulo || ''}</td>
                    <td>${incidencia.estado || ''}</td>
                    <td>${evidenciaLink}</td>
                `;
                incidenciasBody.appendChild(row);
            });
        };

        const cargarIncidencias = async () => {
            try {
                const response = await fetch('/api/incidencias/');
                if (!response.ok) {
                    throw new Error('Error al cargar incidencias');
                }
                const data = await response.json();
                renderIncidencias(Array.isArray(data) ? data : data.results || []);
            } catch (error) {
                incidenciasBody.innerHTML = '<tr><td colspan="4">No se pudo cargar el listado.</td></tr>';
            }
        };

        incidenciaForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const evidenciaFile = evidenciaInput.files[0];
            const validacion = validarEvidencia(evidenciaFile);
            if (!validacion.ok) {
                mensaje.textContent = validacion.message;
                return;
            }

            const formData = new FormData(incidenciaForm);
            formData.append('ciudadano', dniInput.value.trim());

            try {
                const response = await fetch('/api/incidencias/', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    mensaje.textContent = 'No se pudo registrar la incidencia.';
                    return;
                }

                mensaje.textContent = 'Incidencia registrada correctamente.';
                incidenciaForm.reset();
                evidenciaInput.value = '';
                cargarIncidencias();
            } catch (error) {
                mensaje.textContent = 'Error de red al registrar la incidencia.';
            }
        });

        cargarIncidencias();
    </script>
</body>
</html>
